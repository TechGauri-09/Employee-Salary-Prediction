<!DOCTYPE html>
<html>
<head>
    <title>Salary Predictor</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Segoe UI', Arial, sans-serif;
            background: linear-gradient(135deg, #1F3864, #2E5EAA);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }
        .card {
            background: #ffffff;
            border-radius: 16px;
            padding: 40px;
            width: 100%;
            max-width: 420px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.25);
        }
        h2 {
            color: #1F3864;
            text-align: center;
            margin-bottom: 6px;
        }
        .subtitle {
            text-align: center;
            color: #777;
            font-size: 13px;
            margin-bottom: 25px;
        }
        label {
            display: block;
            margin-top: 15px;
            margin-bottom: 6px;
            font-size: 14px;
            color: #333;
            font-weight: 600;
        }
        input, select {
            width: 100%;
            padding: 10px 12px;
            border: 1px solid #ccc;
            border-radius: 8px;
            font-size: 14px;
            outline: none;
            transition: 0.2s;
        }
        input:focus, select:focus {
            border-color: #1F3864;
            box-shadow: 0 0 0 2px rgba(31,56,100,0.15);
        }
        button {
            width: 100%;
            margin-top: 25px;
            padding: 12px;
            background: #1F3864;
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            transition: 0.2s;
        }
        button:hover { background: #16294a; }
        .result {
            margin-top: 20px;
            background: #EAF3EA;
            border-left: 4px solid #2E7D32;
            padding: 14px;
            border-radius: 8px;
            text-align: center;
        }
        .result h3 { color: #2E7D32; font-size: 20px; }
        .note {
            margin-top: 20px;
            font-size: 11.5px;
            color: #999;
            text-align: center;
            line-height: 1.5;
        }
    </style>
</head>
<body>
    <div class="card">
        <h2>Employee Salary Predictor</h2>
        <p class="subtitle">ML model trained on Experience, Age, Education, Department & Skills</p>

        <form method="POST">
            <label>Experience (years)</label>
            <input type="number" name="experience" min="0" max="20" required>

            <label>Age</label>
            <input type="number" name="age" min="21" max="55" required>

            <label>Education</label>
            <select name="education">
                {% for e in education %}<option value="{{e}}">{{e}}</option>{% endfor %}
            </select>

            <label>Department</label>
            <select name="department">
                {% for d in departments %}<option value="{{d}}">{{d}}</option>{% endfor %}
            </select>

            <label>Primary Skill</label>
            <select name="skills">
                {% for s in skills %}<option value="{{s}}">{{s}}</option>{% endfor %}
            </select>

            <button type="submit">Predict Salary</button>
        </form>

        {% if prediction %}
        <div class="result">
            <h3>{{ prediction }}</h3>
        </div>
        {% endif %}

        <p class="note">Prediction is based on patterns learned from historical employee data — actual salaries may vary depending on company policy and negotiation.</p>
    </div>
</body>
</html>
